# Render Blueprint — Dashboard EVO·VISION (plano free)
# Deploy: https://dashboard.render.com -> New -> Blueprint -> aponta para este repositório
# (Render free: 512 MB RAM, dorme após ~15 min sem tráfego; primeiro acesso após dormir demora ~30–60s)
services:
  - type: web
    name: evo-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-dashboard.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        value: https://evolution-beta-six.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.6
